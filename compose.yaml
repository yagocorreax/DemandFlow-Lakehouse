x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: infra/airflow/Dockerfile

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor

    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}

    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}

    AIRFLOW__CELERY__BROKER_URL: redis://airflow-redis:6379/0

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    DEMANDFLOW_DOCKER_NETWORK: ${DEMANDFLOW_DOCKER_NETWORK}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins

  depends_on:
    airflow-db:
      condition: service_healthy

    airflow-redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: demandflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

    volumes:
      - demandflow_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:latest
    container_name: demandflow-localstack
    restart: unless-stopped

    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      AWS_DEFAULT_REGION: ${AWS_REGION}
      DEBUG: "0"
      PERSISTENCE: "1"

    ports:
      - "4566:4566"

    volumes:
      - demandflow_localstack_data:/var/lib/localstack
  spark:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu

    profiles:
      - processing

    working_dir: /opt/demandflow

    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION}
      LOCALSTACK_INTERNAL_ENDPOINT: ${LOCALSTACK_INTERNAL_ENDPOINT}

      KAFKA_INTERNAL_BOOTSTRAP_SERVERS: ${KAFKA_INTERNAL_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_PATTERN: ${KAFKA_TOPIC_PATTERN}

      SILVER_S3_PATH: ${SILVER_S3_PATH}
      QUARANTINE_S3_PATH: ${QUARANTINE_S3_PATH}

      RAW_S3_PATH: ${RAW_S3_PATH}
      RAW_CHECKPOINT_PATH: ${RAW_CHECKPOINT_PATH}

      GOLD_S3_PATH: ${GOLD_S3_PATH}

      BRONZE_S3_PATH: ${BRONZE_S3_PATH}

      PYSPARK_PYTHON: python3

    depends_on:
      - localstack

    volumes:
      - ./src:/opt/demandflow/src:ro
      - ./config:/opt/demandflow/config:ro

    mem_limit: 3g
    cpus: "2.0"

  hive-metastore-init:
    image: alpine:3.20
    container_name: demandflow-hive-metastore-init

    profiles:
      - query

    user: "0:0"

    command:
      - sh
      - -c
      - |
        chown -R 1000:1000 /opt/hive/data
        chmod -R u+rwX /opt/hive/data

    volumes:
      - demandflow_hive_metastore_data:/opt/hive/data

    restart: "no"

  hive-metastore:
    build:
      context: .
      dockerfile: infra/hive-metastore/Dockerfile

    image: demandflow-hive-metastore:4.0.0-s3
    container_name: demandflow-hive-metastore
    restart: unless-stopped

    profiles:
      - query

    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: derby
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop

      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionURL=jdbc:derby:;databaseName=/opt/hive/data/metastore_db;create=true
        -Djavax.jdo.option.ConnectionDriverName=org.apache.derby.jdbc.EmbeddedDriver

    depends_on:
      - localstack

    ports:
      - "9083:9083"

    volumes:
      - demandflow_hive_metastore_data:/opt/hive/data
      - ./infra/hive-metastore/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro

    mem_limit: 1g
    cpus: "1.0"

  trino:
    image: trinodb/trino:483
    container_name: demandflow-trino
    restart: unless-stopped

    profiles:
      - query

    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    depends_on:
      localstack:
        condition: service_started

      hive-metastore-init:
        condition: service_completed_successfully

    ports:
      - "8080:8080"

    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro

    mem_limit: 2g
    cpus: "2.0"

  kafka:
    image: apache/kafka:4.3.0
    container_name: demandflow-kafka
    hostname: kafka
    restart: unless-stopped

    profiles:
      - cdc

    ports:
      - "9092:9092"

    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: >-
        PLAINTEXT://:29092,
        CONTROLLER://:29093,
        PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:29092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"

    volumes:
      - demandflow_kafka_data:/tmp/kraft-combined-logs

    healthcheck:
      test:
        [
        "CMD-SHELL",
        "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"
      ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  debezium:
    image: quay.io/debezium/connect:3.6
    container_name: demandflow-debezium
    restart: unless-stopped

    profiles:
      - cdc

    environment:
      BOOTSTRAP_SERVERS: kafka:29092

      GROUP_ID: demandflow-connect

      CONFIG_STORAGE_TOPIC: demandflow-connect-configs
      OFFSET_STORAGE_TOPIC: demandflow-connect-offsets
      STATUS_STORAGE_TOPIC: demandflow-connect-status

      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"

    depends_on:
      kafka:
        condition: service_healthy

      postgres:
        condition: service_healthy

    ports:
      - "8083:8083"

    mem_limit: 1200m
    cpus: "1.0"

  superset:
    build:
      context: .
      dockerfile: infra/superset/Dockerfile
    container_name: demandflow-superset
    restart: unless-stopped
    profiles:
      - bi
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_HOME: /app/superset_home
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    ports:
      - "8088:8088"
    volumes:
      - demandflow_superset_home:/app/superset_home
      - ./infra/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    command:
      - superset
      - run
      - -h
      - 0.0.0.0
      - -p
      - "8088"
      - --with-threads
    mem_limit: 1g

  airflow-db:
    image: postgres:16-alpine
    container_name: demandflow-airflow-db
    restart: unless-stopped

    profiles:
      - orchestration

    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    volumes:
      - demandflow_airflow_db_data:/var/lib/postgresql/data


  airflow-redis:
    image: redis:7-alpine
    container_name: demandflow-airflow-redis
    restart: unless-stopped

    profiles:
      - orchestration

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  airflow-init:
    <<: *airflow-common

    container_name: demandflow-airflow-init

    profiles:
      - orchestration

    entrypoint: /bin/bash

    command:
      - -c
      - |
        airflow db migrate

        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname DemandFlow \
          --lastname Admin \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" \
        || true

    environment:
      <<: *airflow-common-env

      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
      DEMANDFLOW_DOCKER_NETWORK: ${DEMANDFLOW_DOCKER_NETWORK}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

  airflow-api-server:
    <<: *airflow-common

    container_name: demandflow-airflow-api-server
    restart: unless-stopped

    profiles:
      - orchestration

    command: api-server

    ports:
      - "8081:8080"


  airflow-scheduler:
    <<: *airflow-common

    container_name: demandflow-airflow-scheduler
    restart: unless-stopped

    profiles:
      - orchestration

    command: scheduler


  airflow-dag-processor:
    <<: *airflow-common

    container_name: demandflow-airflow-dag-processor
    restart: unless-stopped

    profiles:
      - orchestration

    command: dag-processor


  airflow-triggerer:
    <<: *airflow-common

    container_name: demandflow-airflow-triggerer
    restart: unless-stopped

    profiles:
      - orchestration

    command: triggerer


  airflow-worker:
    <<: *airflow-common

    container_name: demandflow-airflow-worker
    restart: unless-stopped

    profiles:
      - orchestration

    command: celery worker

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  demandflow_postgres_data:
  demandflow_hive_metastore_data:
  demandflow_kafka_data:
  demandflow_localstack_data:
  demandflow_superset_home:
  demandflow_airflow_db_data: