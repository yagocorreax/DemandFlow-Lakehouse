services:
  postgres:
    image: postgres:16-alpine
    container_name: demandflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

    volumes:
      - demandflow_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:latest
    container_name: demandflow-localstack
    restart: unless-stopped

    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      AWS_DEFAULT_REGION: ${AWS_REGION}
      DEBUG: "0"

    ports:
      - "4566:4566"
  spark:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu

    profiles:
      - processing

    working_dir: /opt/demandflow

    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION}
      LOCALSTACK_INTERNAL_ENDPOINT: ${LOCALSTACK_INTERNAL_ENDPOINT}
      PYSPARK_PYTHON: python3

    depends_on:
      - localstack

    volumes:
      - ./src:/opt/demandflow/src:ro

    mem_limit: 3g
    cpus: "2.0"

  hive-metastore-init:
    image: alpine:3.20
    container_name: demandflow-hive-metastore-init

    profiles:
      - query

    user: "0:0"

    command:
      - sh
      - -c
      - |
        chown -R 1000:1000 /opt/hive/data
        chmod -R u+rwX /opt/hive/data

    volumes:
      - demandflow_hive_metastore_data:/opt/hive/data

    restart: "no"

  hive-metastore:
    build:
      context: .
      dockerfile: infra/hive-metastore/Dockerfile

    image: demandflow-hive-metastore:4.0.0-s3
    container_name: demandflow-hive-metastore
    restart: unless-stopped

    profiles:
      - query

    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: derby
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop

      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionURL=jdbc:derby:;databaseName=/opt/hive/data/metastore_db;create=true
        -Djavax.jdo.option.ConnectionDriverName=org.apache.derby.jdbc.EmbeddedDriver

    depends_on:
      - localstack

    ports:
      - "9083:9083"

    volumes:
      - demandflow_hive_metastore_data:/opt/hive/data
      - ./infra/hive-metastore/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro

    mem_limit: 1g
    cpus: "1.0"

  trino:
    image: trinodb/trino:483
    container_name: demandflow-trino
    restart: unless-stopped

    profiles:
      - query

    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    depends_on:
      localstack:
        condition: service_started

      hive-metastore-init:
        condition: service_completed_successfully

    ports:
      - "8080:8080"

    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro

    mem_limit: 2g
    cpus: "2.0"

volumes:
  demandflow_postgres_data:
  demandflow_hive_metastore_data:
