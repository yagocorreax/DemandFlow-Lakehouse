services:
  postgres:
    image: postgres:16-alpine
    container_name: demandflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

    volumes:
      - demandflow_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:latest
    container_name: demandflow-localstack
    restart: unless-stopped

    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      AWS_DEFAULT_REGION: ${AWS_REGION}
      DEBUG: "0"

    ports:
      - "4566:4566"
  spark:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu

    profiles:
      - processing

    working_dir: /opt/demandflow

    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION}
      LOCALSTACK_INTERNAL_ENDPOINT: ${LOCALSTACK_INTERNAL_ENDPOINT}

      KAFKA_INTERNAL_BOOTSTRAP_SERVERS: ${KAFKA_INTERNAL_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_PATTERN: ${KAFKA_TOPIC_PATTERN}

      RAW_S3_PATH: ${RAW_S3_PATH}
      RAW_CHECKPOINT_PATH: ${RAW_CHECKPOINT_PATH}

      PYSPARK_PYTHON: python3

    depends_on:
      - localstack

    volumes:
      - ./src:/opt/demandflow/src:ro

    mem_limit: 3g
    cpus: "2.0"

  hive-metastore-init:
    image: alpine:3.20
    container_name: demandflow-hive-metastore-init

    profiles:
      - query

    user: "0:0"

    command:
      - sh
      - -c
      - |
        chown -R 1000:1000 /opt/hive/data
        chmod -R u+rwX /opt/hive/data

    volumes:
      - demandflow_hive_metastore_data:/opt/hive/data

    restart: "no"

  hive-metastore:
    build:
      context: .
      dockerfile: infra/hive-metastore/Dockerfile

    image: demandflow-hive-metastore:4.0.0-s3
    container_name: demandflow-hive-metastore
    restart: unless-stopped

    profiles:
      - query

    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: derby
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop

      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionURL=jdbc:derby:;databaseName=/opt/hive/data/metastore_db;create=true
        -Djavax.jdo.option.ConnectionDriverName=org.apache.derby.jdbc.EmbeddedDriver

    depends_on:
      - localstack

    ports:
      - "9083:9083"

    volumes:
      - demandflow_hive_metastore_data:/opt/hive/data
      - ./infra/hive-metastore/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro

    mem_limit: 1g
    cpus: "1.0"

  trino:
    image: trinodb/trino:483
    container_name: demandflow-trino
    restart: unless-stopped

    profiles:
      - query

    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    depends_on:
      localstack:
        condition: service_started

      hive-metastore-init:
        condition: service_completed_successfully

    ports:
      - "8080:8080"

    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro

    mem_limit: 2g
    cpus: "2.0"

  kafka:
    image: apache/kafka:4.3.0
    container_name: demandflow-kafka
    hostname: kafka
    restart: unless-stopped

    profiles:
      - cdc

    ports:
      - "9092:9092"

    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: >-
        PLAINTEXT://:29092,
        CONTROLLER://:29093,
        PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:29092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"

    volumes:
      - demandflow_kafka_data:/tmp/kraft-combined-logs

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    mem_limit: 1g
    cpus: "1.5"

  debezium:
    image: quay.io/debezium/connect:3.6
    container_name: demandflow-debezium
    restart: unless-stopped

    profiles:
      - cdc

    environment:
      BOOTSTRAP_SERVERS: kafka:29092

      GROUP_ID: demandflow-connect

      CONFIG_STORAGE_TOPIC: demandflow-connect-configs
      OFFSET_STORAGE_TOPIC: demandflow-connect-offsets
      STATUS_STORAGE_TOPIC: demandflow-connect-status

      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"

    depends_on:
      kafka:
        condition: service_healthy

      postgres:
        condition: service_healthy

    ports:
      - "8083:8083"

    mem_limit: 1200m
    cpus: "1.0"

volumes:
  demandflow_postgres_data:
  demandflow_hive_metastore_data:
  demandflow_kafka_data:
